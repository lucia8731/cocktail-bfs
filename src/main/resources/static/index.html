<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><meta name="description" content="A student data structures experiment: step through breadth-first search on a cocktail recipe graph.">
<title>Last Call · Graph / BFS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
<script src="runtime-config.js" defer></script><script src="engine.js" defer></script><script src="graph-state.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<header><a href="./" class="name">Last Call</a><span class="page-name">Graph / BFS</span><a href="https://github.com/lucia8731/last-call" target="_blank" rel="noopener">GitHub ↗</a></header>
<main>
<form id="path-form" class="controls">
<label>From<select id="from" disabled></select></label>
<button id="swap" class="quiet" type="button" aria-label="Swap start and end" disabled>⇄</button>
<label>To<select id="to" disabled></select></label>
<button id="run" type="submit" class="primary" disabled>Run BFS</button>
</form>
<div class="graph-meta"><span>24 vertices <span aria-hidden="true">·</span> <span id="edge-count">—</span> edges</span><span>Edge = 2+ shared ingredients</span></div>
<div id="error" class="error" role="alert" hidden></div>
<div class="workspace">
<section class="graph-panel" aria-label="Graph visualization">
<div class="graph-toolbar"><div class="legend"><span><i class="current-mark"></i>Current</span><span><i class="queue-mark"></i>Queued</span><span><i class="visited-mark"></i>Visited</span><span><i class="path-mark"></i>Path</span></div><div class="zoom"><button type="button" id="zoom-out" class="quiet" aria-label="Zoom out">−</button><button type="button" id="zoom-in" class="quiet" aria-label="Zoom in">+</button></div></div>
<div id="graph-scroll" class="graph-scroll"><div id="graph" class="graph"></div></div>
<div class="playback"><button id="reset" class="quiet" disabled>Reset</button><button id="back" class="quiet" disabled>Back</button><button id="play" disabled>Play</button><button id="next" class="quiet" disabled>Next</button><button id="end" class="quiet" disabled>End</button><span id="step-label">Step —</span></div>
<label class="sr-only" for="timeline">BFS step</label><input id="timeline" type="range" min="0" max="0" value="0" disabled>
<section class="path-section" aria-label="Shortest path"><div class="section-label">Shortest path <span id="path-length"></span></div><div id="path" class="path" aria-live="polite"></div></section>
</section>
<aside class="state-panel" aria-label="BFS data structures">
<section><h2>Current</h2><div id="current" class="current-value">—</div></section>
<section><h2>Queue <code>ArrayDeque</code><span id="queue-count" class="count"></span></h2><div class="queue-direction"><span>front →</span><span>← back</span></div><div id="queue" class="queue"></div></section>
<section><h2>Visited <code>Set</code><span id="visited-count" class="count"></span></h2><div id="visited" class="visited-list"></div></section>
<section><h2>Parent <code>Map</code></h2><div id="parents" class="parents"></div></section>
</aside>
</div>
<div class="lower-panels">
<details open><summary>Selected vertex</summary><div id="vertex-detail" class="vertex-detail"></div></details>
<details><summary>Adjacency list</summary><div id="adjacency" class="adjacency"></div></details>
<details><summary>Trace</summary><div class="trace-wrap"><table><thead><tr><th>Step</th><th>Dequeue</th><th>Enqueue</th><th>Queue after</th></tr></thead><tbody id="trace"></tbody></table></div></details>
</div>
<footer><span id="runtime">Loading…</span><span>Core BFS: O(V + E) <span aria-hidden="true">·</span> <a href="https://github.com/lucia8731/last-call/blob/main/docs/ARCHITECTURE.md" target="_blank" rel="noopener">Notes ↗</a></span></footer>
</main>
</body>
</html>
